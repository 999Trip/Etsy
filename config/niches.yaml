  # --- Canva-generated (type: canva) -----------------------------------
  # Generation is interactive-only: Claude calls the Canva MCP tools
  # (generate-design -> create-design-from-candidate -> export-design)
  # using the query recipes below, then runs `pipeline.canva_import` with
  # the resulting export URLs to package the result into this same
  # output/<niche>/<slug>/metadata.json shape - see pipeline/canva_import.py.
  # Illustrated/painterly artwork (vintage textures, hand-lettered script,
  # watercolor florals) that the procedural Pillow generators can't
  # produce, per 2026 trend research showing vintage/illustrated styles
  # outperforming flat-vector minimalism this season.

  halloween_vintage_posters_canva:
    type: canva
    product_mode: digital
    canva_design_type: poster
    digital_sizes: [letter_8.5x11, a4]
    price_digital: 5.00
    prompts:
      - label: "Happy Haunting Pumpkin"
        query: >-
          Vintage retro Halloween poster, 1970s groovy typography, "Happy
          Haunting" text, warm burnt-orange and deep purple color palette,
          distressed illustrated pumpkin and moon, nostalgic autumn
          aesthetic, no photographic people
      - label: "Basic Witch"
        query: >-
          Vintage retro Halloween poster, hand-lettered script text
          reading "Basic Witch", illustrated witch hat and crescent moon,
          distressed paper texture, deep purple and mustard color palette,
          no photographic people
      - label: "Vintage Black Cat"
        query: >-
          Vintage retro Halloween poster, retro illustrated black cat
          silhouette under a full moon, hand-lettered "Meow-y Halloween"
          text, distressed texture, burnt orange and charcoal palette, no
          photographic people
      - label: "Haunted House"
        query: >-
          Vintage retro Halloween poster, illustrated haunted house on a
          hill under a starry night sky, groovy 1970s typography reading
          "Trick or Treat", distressed texture, deep purple and orange
          palette, no photographic people
    seo:
      title_template: >-
        {variant_title} Vintage Halloween Poster | Retro Illustrated Wall
        Art | Digital Download Printable
      description_template: |
        A {variant_title} vintage-style Halloween poster - hand-lettered
        typography and illustrated retro artwork with a distressed,
        nostalgic finish. Printable wall art for gallery walls, party
        decor, or a front-door sign.

        WHAT YOU GET
        - High-resolution print-ready PDF files (US Letter and A4)

        This is a digital file - no physical item will be shipped.
      tags:
        - vintage halloween
        - retro halloween
        - halloween poster
        - illustrated art
        - printable art
        - digital download
        - halloween decor
        - retro poster
        - spooky season
        - instant download
        - wall art print
        - autumn decor

  halloween_vintage_apparel_canva:
    type: canva
    product_mode: pod
    canva_design_type: poster
