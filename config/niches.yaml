# Starter niche definitions for the design pipeline.
#
# Each niche maps to one generator in design/generators/ and gives the
# pipeline everything it needs to produce a batch of finished, listable
# products: which palettes/motifs/quotes to combine, which physical sizes
# to export, and SEO copy templates for the Etsy/Printify listing.
#
# product_mode: "digital" (Etsy digital download only), "pod" (Printify
# print-on-demand only), or "both".
#
# Feel free to duplicate a niche block and tweak it to make a new one -
# nothing here is hardcoded into the pipeline scripts.

niches:
  boho_line_art_wall_decor:
    type: line_art
    product_mode: both
    palettes: [terracotta_boho, sage_minimal, clay_rust, midnight_gold]
    motifs: [arch, sun, wave, moon_phases]
    digital_sizes: [poster_18x24, 5x7]
    pod_sizes: [poster_18x24]
    price_digital: 4.50
    price_pod: 24.00
    seo:
      title_template: >-
        {motif_title} Boho Line Art Printable | Minimalist {palette_title}
        Wall Decor | Digital Download Poster
      description_template: |
        A minimalist {motif_title} line-art print in a {palette_title} colour
        palette. Perfect for gallery walls, living rooms, nurseries, and
        boho-modern interiors.

        WHAT YOU GET
        - High-resolution PDF and PNG files (300 DPI)
        - Ready to print at home, at a local print shop, or order framed

        This is a digital file - no physical item will be shipped.
        For personal use only; not for resale or redistribution of the file.
      tags:
        - boho wall art
        - line art print
        - minimalist decor
        - printable art
        - digital download
        - boho decor
        - arch print
        - home decor
        - instant download
        - wall art print
        - aesthetic prints
        - modern boho art

