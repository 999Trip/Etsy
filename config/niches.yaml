  halloween_pattern_tumblers_canva:
    type: canva
    product_mode: pod
    canva_design_type: poster
    # All-over pattern, not a box-print graphic - crop-to-fill the POD
    # print area edge to edge instead of the default "contain" fit.
    pod_fit: cover
    # All-over repeating patterns for 40oz tumblers and mugs, Canva-sourced
    # per user preference (see halloween_pattern_tumblers_canva history) -
    # original artwork in the same visual genre as trending tumbler wraps
    # (purple w/ cat-in-pumpkin + jack-o'-lanterns, cozy critters, starry
    # night, all-over jack-o'-lantern faces) without copying any specific
    # existing commercial product's design.
    pod_sizes: [mug_9x4, tumbler_40oz_straight]
    # Blueprint 1715 ("Vacuum Thermal Tumbler, 40oz", Smart Printee
    # provider), not 1509 ("Harrier") - Harrier tapers to a narrow
    # unprinted white foot and costs $31.86; this one has straight walls
    # (near-full-height print coverage), costs $13.96, and offers 12
    # colors instead of just white. $32.99 gives a healthier ~35%+
    # margin after Etsy's ~9.5% fees than Harrier's $47.99 did, and is
    # more competitive against comparable Etsy tumbler listings.
    price_pod: 32.99
    prompts:
      - label: Cat in Pumpkin
        query: >-
          A seamless all-over repeating pattern for a tumbler wrap print,
          Halloween theme: a black cat peeking out of a jack-o'-lantern as
          the main motif, smaller jack-o'-lantern faces scattered around,
          white polka dots and small stars for texture, on a purple
          background, flat bold illustrated icon style, no text,
          edge-to-edge full-bleed pattern
      - label: Cozy Critters
        query: >-
          A seamless all-over repeating pattern design for a tumbler/mug
          wrap print, cozy Halloween theme: black cats, jack-o'-lantern
          pumpkins, and ghosts scattered across a warm background, flat
          bold illustrated icon style, no text, edge-to-edge full-bleed
          pattern, trendy aesthetic
      - label: Night Sky
        query: >-
          A seamless all-over repeating pattern design for a tumbler/mug
          wrap print, Halloween night sky theme: bats, crescent moons, and
          stars scattered across a deep midnight-purple background, flat
          bold illustrated icon style, no text, edge-to-edge full-bleed
          pattern
      - label: Jack-o'-Lanterns
        query: >-
          A seamless all-over repeating pattern design for a tumbler/mug
          wrap print, Halloween theme: illustrated jack-o'-lantern pumpkin
          faces with varied expressions scattered edge to edge, flat bold
          illustrated icon style, warm orange and black palette, no text,
          full-bleed pattern
    seo:
      title_template: >-
        {variant_title} Halloween Pattern | All-Over Print Tumbler & Mug
        Wrap Design
      description_template: |
        A {variant_title} all-over Halloween pattern, wrapped edge to edge
        on a 40oz tumbler - a bold, colorful print that stands out on the
        shelf.

        PRODUCT DETAILS
        - Durable stainless steel construction with a glossy coating
        - Double-wall vacuum insulation - keeps drinks hot or cold for hours
        - Rubber-sealed push-down lid with reusable straw included
        - Hand wash only

        Available in multiple product types, sizes, and colors - see the
        variant options on this listing.
      tags:
        - tumbler wrap
        - halloween tumbler
        - 40oz tumbler
        - mug wrap design
        - halloween mug
        - pattern design
        - all over print
        - spooky pattern
        - halloween pattern
        - cup wrap design
        - witchy tumbler
        - pumpkin tumbler

  fall_halloween_calendar_printable:
    type: planner
    product_mode: digital
    # Canva's AI reliably produced decorative posters/invitations/articles
    # for this (tried "document" and "poster" design_types, got an
    # invoice, a fake press release, and a fake event poster - never an
    # actual date grid), so this one is procedural like the other planner
    # niches - exact grids are what design/generators/planner.py is for.
    planner_template: monthly_calendar
    header_template: "{variant_title}"
    palettes: [terracotta_boho, midnight_gold, pumpkin_orange, sage_minimal]
    variants:
      - name: October 2026
        kwargs: {month: 10, year: 2026}
      - name: November 2026
        kwargs: {month: 11, year: 2026}
      - name: Year Round Fall
        kwargs: {undated: true}
    digital_sizes: [letter_8.5x11, a4]
    # $4.50: printable calendars/planners on Etsy cluster $3-8 (plain
    # ones nearer $1.50-3, "premium"/illustrated ones higher); these
    # have a bold illustrated background, not a bare grid.
    price_digital: 4.50
    seo:
      title_template: >-
        {variant_title} Printable Calendar | Fall Halloween Monthly
        Planner Page | Instant Download
      description_template: |
        A {variant_title} printable calendar page - a clean, illustrated
        way to plan out your month.

        WHAT YOU GET
        - High-resolution PDF and PNG files (300 DPI)
        - Letter (8.5x11) and A4 sizes included

        This is a digital file - no physical item will be shipped. Print
        at home or at your favorite print shop.
      tags:
        - fall calendar
        - halloween calendar
        - printable calendar
        - monthly planner
        - october calendar
        - november calendar
        - digital download
        - instant download
        - fall printable
        - autumn planner
        - cozy planner
        - desk calendar

  halloween_weekly_planner_printable:
    type: planner
    product_mode: digital
    # Same reasoning as fall_halloween_calendar_printable: Canva can't
    # reliably produce an actual write-in weekly grid, so this uses the
    # illustrated-background + procedural-grid pattern (see
    # pipeline.canva_import.import_weekly_planner_with_illustrated_background)
    # rather than asking Canva's AI to generate the grid itself.
    planner_template: weekly_planner
    header_template: "{variant_title}"
    palettes: [terracotta_boho, midnight_gold, pumpkin_orange, sage_minimal]
    variants:
      - name: Weekly Planner
    digital_sizes: [letter_8.5x11, a4]
    # Matches fall_halloween_calendar_printable's single-design pricing -
    # bold illustrated background, fillable write-in grid.
    price_digital: 4.50
    seo:
      title_template: >-
        Halloween Weekly Planner Printable | Spooky Cute Fillable
        Undated Week Planner Page | Instant Download
      description_template: |
        A spooky-cute Halloween weekly planner page - a bold illustrated
        design with a clean, fillable Monday-Sunday grid plus a notes
        section, for planning out your week by hand.

        WHAT YOU GET
        - High-resolution PDF and PNG files (300 DPI)
        - Letter (8.5x11) and A4 sizes included
        - Undated - use it any week, print as many as you like

        This is a digital file - no physical item will be shipped. Print
        at home or at your favorite print shop.
      tags:
        - weekly planner
        - halloween planner
        - printable planner
        - fillable planner
        - undated planner
        - digital download
        - instant download
        - spooky planner
        - fall planner
        - cozy planner
        - productivity planner
        - planner page
        - to do list
